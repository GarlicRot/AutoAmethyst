name: Build and Release AutoAmethyst

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Build and publish tagged source
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Gradle and validate wrapper
        uses: gradle/actions/setup-gradle@v6
      - name: Allow executing Gradle wrapper
        run: chmod +x ./gradlew
      - name: Verify the version matches the pushed tag
        shell: bash
        run: |
          set -euo pipefail
          version=$(sed -n 's/^plugin_version=//p' gradle.properties | tr -d '[:space:]')
          [[ -n "$version" && "v$version" == "$GITHUB_REF_NAME" ]] || {
            echo "ERROR: tag '$GITHUB_REF_NAME' does not match plugin_version='$version'"
            exit 1
          }
      - name: Extract RusherHack access widener
        run: ./gradlew --no-daemon updateAccessWidener
      - name: Test and build from tagged source
        run: ./gradlew --no-daemon test build
      - name: Verify JAR metadata and create checksum
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          jar="build/libs/AutoAmethyst-${version}.jar"
          [[ -s "$jar" ]] || { echo "ERROR: expected JAR missing: $jar"; exit 1; }
          python3 - "$jar" "$version" <<'PY'
          import json
          import sys
          import zipfile

          jar_path, version = sys.argv[1:]
          with zipfile.ZipFile(jar_path) as archive:
              metadata = json.loads(archive.read("rusherhack-plugin.json"))
          assert metadata["Name"] == "AutoAmethyst", metadata
          assert metadata["Version"] == version, metadata
          assert metadata["Minecraft-Versions"] == ["1.21.4"], metadata
          print(f"Verified AutoAmethyst {version} metadata for Minecraft 1.21.4")
          PY
          mkdir -p dist
          cp "$jar" dist/
          (cd dist && sha256sum "AutoAmethyst-${version}.jar" > SHA256SUMS.txt)
          (cd dist && sha256sum -c SHA256SUMS.txt)
      - name: Publish GitHub-built JAR and checksum
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: |
            dist/AutoAmethyst-*.jar
            dist/SHA256SUMS.txt
          fail_on_unmatched_files: true
