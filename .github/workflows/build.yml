name: Build and Test

on:
  push:
    branches:
      - master
      - 'rewrite/**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Java 21 / Minecraft 1.21.4
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Gradle and validate wrapper
        uses: gradle/actions/setup-gradle@v6
      - name: Allow executing Gradle wrapper
        run: chmod +x ./gradlew
      - name: Extract RusherHack access widener
        run: ./gradlew --no-daemon updateAccessWidener
      - name: Run unit tests and build plugin
        run: ./gradlew --no-daemon test build
      - name: Upload JAR from GitHub build
        uses: actions/upload-artifact@v4
        with:
          name: AutoAmethyst-build-${{ github.sha }}
          path: build/libs/AutoAmethyst-*.jar
          if-no-files-found: error
          retention-days: 14
