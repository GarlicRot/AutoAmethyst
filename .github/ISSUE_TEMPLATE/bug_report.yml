name: Bug report
description: Report a reproducible problem with AutoAmethyst
title: "[Bug] "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "Please confirm you're using the correct Minecraft version and only one AutoAmethyst JAR. Avoid including server addresses, tokens, or personal data in logs."
  - type: input
    id: version
    attributes:
      label: AutoAmethyst version
      placeholder: 2.0.0
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Minecraft / RusherHack version
      placeholder: "Minecraft 1.21.4, RusherHack version ..."
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: What were you doing, and what happened?
      placeholder: "1. Stand near a mature amethyst cluster ..."
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant error/log excerpt (optional)
      description: Remove account details, IPs and other sensitive information.
      render: text
