plugins {
    id 'java'
    id 'idea'
    id 'fabric-loom' version '1.9-SNAPSHOT'
}

version = project.plugin_version
group = project.maven_group
base.archivesName = project.plugin_name

configurations {
    rusherhackApi
    compileOnly.extendsFrom(rusherhackApi)
    productionRuntime {
        extendsFrom configurations.minecraftLibraries
        extendsFrom configurations.loaderLibraries
        extendsFrom configurations.minecraftRuntimeLibraries
    }
}

repositories {
    maven {
        name = 'RusherHackSnapshots'
        url = 'https://maven.rusherhack.org/snapshots'
    }
    maven {
        name = 'ParchmentMC'
        url = 'https://maven.parchmentmc.org'
    }
    mavenCentral()
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    productionRuntime(modImplementation("net.fabricmc:fabric-loader:${project.fabric_loader_version}"))
    productionRuntime("net.fabricmc:intermediary:${project.minecraft_version}")

    mappings loom.layered() {
        officialMojangMappings()
        parchment("org.parchmentmc.data:parchment-${project.parchment_version}@zip")
    }

    rusherhackApi "org.rusherhack:rusherhack-api:${project.minecraft_version}-SNAPSHOT"
    testImplementation 'org.junit.jupiter:junit-jupiter:5.11.4'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.register('updateAccessWidener', Copy) {
    group = 'build'
    description = 'Extract the RusherHack API access widener into build/tmp.'
    from {
        zipTree(configurations.rusherhackApi.singleFile).matching {
            include 'rusherhack.accesswidener'
        }
    }
    into layout.buildDirectory.dir("tmp/${project.minecraft_version}")
}

loom {
    def widener = file("build/tmp/${project.minecraft_version}/rusherhack.accesswidener")
    if (widener.exists()) {
        accessWidenerPath = widener
    } else {
        logger.lifecycle('RusherHack access widener not found. Run ./gradlew updateAccessWidener first.')
    }
    runConfigs.configureEach {
        ideConfigGenerated = false
    }
}

tasks.register('copyPluginToRunDir', Copy) {
    group = 'build'
    dependsOn remapJar
    from remapJar.outputs
    into file('run/rusherhack/plugins')
}

tasks.register('runPlugin', JavaExec) {
    group = 'build'
    dependsOn remapJar, downloadAssets, copyPluginToRunDir
    classpath.from configurations.productionRuntime
    mainClass = 'net.fabricmc.loader.impl.launch.knot.KnotClient'
    workingDir = file('run')

    doFirst {
        classpath.from loom.minecraftProvider.minecraftClientJar
        workingDir.mkdirs()
        args(
                '--assetIndex', loom.minecraftProvider.versionInfo.assetIndex().fabricId(loom.minecraftProvider.minecraftVersion()),
                '--assetsDir', new File(loom.files.userCache, 'assets').absolutePath,
                '--gameDir', workingDir.absolutePath
        )
        def loader = file('lib/rusherhack-loader.jar')
        if (!loader.exists()) {
            throw new GradleException('Place rusherhack-loader.jar in lib/ to use runPlugin.')
        }
        jvmArgs('-Drusherhack.enablePlugins=true', "-Dfabric.addMods=${loader.absolutePath}")
    }
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(Integer.parseInt(project.java_version))
    sourceCompatibility = JavaVersion.toVersion(project.java_version)
    targetCompatibility = JavaVersion.toVersion(project.java_version)
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = Integer.parseInt(project.java_version)
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
}

processResources {
    filesMatching('rusherhack-plugin.json') {
        expand(project: project)
    }
}

jar {
    manifest {
        attributes('Minecraft-Version': project.minecraft_version)
    }
}

// The first IDE sync sometimes occurs before the access widener has been extracted.
plugins.withId('idea') {
    tasks.matching { it.name == 'ideaSyncTask' || it.name == 'configureLaunch' }.configureEach {
        dependsOn tasks.named('updateAccessWidener')
    }
}
